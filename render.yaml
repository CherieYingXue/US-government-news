services:
  - type: web
    name: us-government-news
    runtime: node
    # An always-on instance lets the built-in timer run the 22:00 GMT update; "free" sleeps when idle.
    plan: starter
    # Migrations run at start (npm start): Render's build step cannot reach the private database.
    buildCommand: npm ci && npm run build:app
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: us-government-news-db
          property: connectionString
      - key: CRON_SECRET
        generateValue: true
      - key: X_BEARER_TOKEN
        sync: false

  # Optional backup trigger for the 22:00 GMT update; only needed if the web service uses the free plan.
  # - type: cron
  #   name: us-government-news-daily
  #   runtime: node
  #   plan: starter
  #   schedule: "0 22 * * *"
  #   buildCommand: "true"
  #   startCommand: 'curl -fsS -m 290 -H "Authorization: Bearer $CRON_SECRET" "http://$APP_HOSTPORT/api/cron"'
  #   envVars:
  #     - key: CRON_SECRET
  #       fromService:
  #         type: web
  #         name: us-government-news
  #         envVarKey: CRON_SECRET
  #     - key: APP_HOSTPORT
  #       fromService:
  #         type: web
  #         name: us-government-news
  #         property: hostport

databases:
  - name: us-government-news-db
    # Render allows one free database per workspace, whatever the workspace plan.
    plan: basic-256mb
    databaseName: tracker
    user: tracker
    ipAllowList: []
